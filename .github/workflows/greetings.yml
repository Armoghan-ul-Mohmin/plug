name: Greetings

on:
  pull_request_target:
    types: [opened]
  issues:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  greeting:
    name: Welcome first-time contributors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            Thanks for opening your first issue in **plug.zsh**!
            A maintainer will take a look soon. In the meantime, `plug doctor`
            output and a minimal reproduction make things much faster to diagnose.
          pr-message: |
            Thanks for your first pull request to **plug.zsh**!
            Please make sure `zsh -n` passes on the files you touched and that
            `zsh test/run-tests.zsh` is green. A maintainer will review it soon.

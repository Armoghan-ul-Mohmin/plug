name: Stale

on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: Mark and close stale issues and PRs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11
        with:
          days-before-stale: 60
          days-before-close: 14
          stale-issue-message: >
            This issue has been inactive for 60 days and is now marked as stale.
            It will close in 14 days unless there is more activity. If it is still
            relevant, please leave a comment (or add the `keep-open` label).
          stale-pr-message: >
            This pull request has been inactive for 60 days and is now marked as
            stale. It will close in 14 days unless there is more activity. If you
            are still working on it, please leave a comment.
          close-issue-message: >
            Closing this as stale. Feel free to reopen if it becomes relevant again.
          close-pr-message: >
            Closing this as stale. Feel free to reopen and continue when you can.
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: pinned,security,keep-open,good first issue,help wanted
          exempt-pr-labels: pinned,security,keep-open
          exempt-all-assignees: true
          operations-per-run: 60
